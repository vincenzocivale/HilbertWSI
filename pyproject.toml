[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hilbert-wsi"
version = "0.1.0"
description = "Space-filling curve ordering of tile embeddings for sequence-based WSI analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HilbertWSI authors" }]
keywords = ["WSI", "pathology", "Hilbert", "Mamba", "MIL", "histopathology"]

dependencies = [
    # torch is intentionally excluded — install it manually before this package
    # with the wheel matching your CUDA driver, e.g.:
    #   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
    "numpy>=1.24",
    "einops>=0.7",
    "hilbertcurve>=2.0",
    "pyyaml>=6.0",
    "h5py>=3.9",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
mamba = ["mamba-ssm>=2.2", "causal-conv1d>=1.4"]
xlstm = ["xlstm>=2.0"]
bench = [
    "trident @ git+https://github.com/mahmoodlab/trident.git",
    "patho-bench @ git+https://github.com/mahmoodlab/Patho-Bench.git",
]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
hilbert-wsi-bench = "hilbert_wsi.cli:main"

[tool.setuptools.packages.find]
include = ["hilbert_wsi*", "adapters*"]

[tool.ruff]
line-length = 100
target-version = "py310"
