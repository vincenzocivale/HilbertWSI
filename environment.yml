name: hilbert-wsi-clean
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core: install torch FIRST to pick up bundled CUDA 12.4 libs
      # On a box with system CUDA < 12.4, the conda activation hook in
      # etc/conda/activate.d/cuda_ld_library_path.sh sets LD_LIBRARY_PATH
      # to prioritize pip-bundled nvidia libs over ldconfig.
      - torch==2.5.1 --extra-index-url https://download.pytorch.org/whl/cu124
      - torchvision==0.20.1 --extra-index-url https://download.pytorch.org/whl/cu124
      - numpy>=1.24
      - h5py>=3.9
      - pyyaml>=6.0
      - pytest>=8
      - einops>=0.7
      - hilbertcurve>=2.0
      - scikit-learn>=1.3
      # Optional GPU-only — install manually after creating the env:
      #   pip install "mamba-ssm>=2.2" "causal-conv1d>=1.4"
      # Optional bench deps:
      #   pip install "git+https://github.com/mahmoodlab/trident.git"
      #   pip install "git+https://github.com/mahmoodlab/Patho-Bench.git"
